spring.application.name=backend

# Conexion a Oracle: valores por defecto para desarrollo local, sobreescribibles por variables de entorno
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:APP_USER}
spring.datasource.password=${DB_PASSWORD:cambiame}

# El esquema lo gestiona Flyway (db/migration), Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
